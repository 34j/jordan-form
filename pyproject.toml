[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "jordan-form"
version = "1.1.0"
description = "Compute jordan canonical (normal) form of (nonlinear / generalized) eigenvalue problem"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "attrs>=25.4.0",
  "numpy>=2.0.2",
  "rich>=10",
  "scipy>=1.13.1",
  "sympy>=1.14",
  "typer>=0.15,<1",
]
optional-dependencies.matplotlib = [ "matplotlib>=3.9.4" ]
urls."Bug Tracker" = "https://github.com/34j/jordan-form/issues"
urls.Changelog = "https://github.com/34j/jordan-form/blob/main/CHANGELOG.md"
urls.documentation = "https://jordan-form.readthedocs.io"
urls.repository = "https://github.com/34j/jordan-form"
scripts.jordan-form = "jordan_form.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-per-file-ignores."/**/docs/conf.py" = [ "A001", "INP001" ]
lint.extend-per-file-ignores."/**/src/jordan_form/_jordan_chain.py" = [
  "ARG001",  # Public tolerance argument retained for API compatibility.
  "N803",    # Matrix names intentionally follow mathematical conventions.
  "N806",    # Matrix names intentionally follow mathematical conventions.
  "PLR2004", # Array dimensions are clear in shape validation.
  "PLR6104", # Avoid changing NumPy array mutation semantics.
  "RUF002",  # Preserve en dashes in bibliographic citations.
]
lint.extend-per-file-ignores."/**/src/jordan_form/_multiplicity.py" = [
  "PLR2004", # Array dimensions are clear in shape validation.
]
lint.extend-per-file-ignores."/**/tests/**/*" = [
  "ANN",
  "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
  "D",
  "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
  "N806",    # Matrix names intentionally follow mathematical conventions.
  "PLR2004", # Magic value used in comparison, ...
  "PLR6104", # Avoid changing NumPy array mutation semantics.
  "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
  "S404",    # subprocess is used intentionally to exercise the module entry point.
  "S603",    # subprocess is used intentionally to exercise the module entry point.
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
# NumPy's scalar/array unions produce noisy diagnostics throughout the numerical API.
rules.invalid-argument-type = "ignore"
terminal.error-on-warning = true
